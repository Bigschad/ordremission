{#
  Gabarit commun aux e-mails, aux couleurs PORTEO GROUP.
  Tout est en styles en ligne : les clients de messagerie ignorent largement
  les feuilles de style, et beaucoup suppriment la balise <style>.
#}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ objet }}</title>
  </head>
  <body style="margin:0;padding:24px 0;background:#F4F5F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ apercu }}</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                 style="width:100%;max-width:600px;background:#FFFFFF;border-radius:8px;overflow:hidden;border-collapse:collapse;">
            <tr>
              <td style="background:#1B2A4A;padding:24px;">
                <div style="color:#FFFFFF;font-size:20px;font-weight:700;letter-spacing:0.06em;">PORTEO GROUP</div>
                <div style="color:#E8A33D;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;margin-top:4px;">Ordres de mission</div>
              </td>
            </tr>

            <tr><td style="padding:28px 24px;">{% block contenu %}{% endblock %}</td></tr>

            <tr>
              <td style="padding:0 24px 24px;">
                <hr style="border:none;border-top:1px solid #E5E7EB;margin:0 0 12px;" />
                <p style="color:#6B7280;font-size:11px;line-height:17px;margin:4px 0 0;">
                  PORTEO GROUP — Abidjan-Marcory, Immeuble Porteo, Boulevard Valery Giscard d&rsquo;Estaing, 08 BP 2212 Abidjan 09
                </p>
                <p style="color:#6B7280;font-size:11px;line-height:17px;margin:4px 0 0;">
                  contact@porteo-group.com — +225 27 21 54 03 03
                </p>
                <p style="color:#6B7280;font-size:11px;line-height:17px;margin:4px 0 0;">
                  Message automatique, merci de ne pas y répondre.
                </p>
              </td>
            </tr>

            <tr>
              <td style="background:#1B2A4A;color:#FFFFFF;font-size:11px;letter-spacing:0.1em;padding:12px 24px;text-align:center;">
                WWW.PORTEO-GROUP.COM
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
