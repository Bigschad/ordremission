{# Tableau récapitulatif, dans l'ordre du formulaire papier. #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="border:1px solid #E5E7EB;border-radius:6px;border-collapse:separate;margin:0 0 20px;">
  {% for libelle, valeur in lignes %}
    <tr>
      <td style="padding:9px 14px;width:42%;color:#6B7280;font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;vertical-align:top;{% if not loop.last %}border-bottom:1px solid #E5E7EB;{% endif %}">
        {{ libelle }}
      </td>
      <td style="padding:9px 14px;color:#1F2937;font-size:13px;vertical-align:top;{% if not loop.last %}border-bottom:1px solid #E5E7EB;{% endif %}">
        {{ valeur }}
      </td>
    </tr>
  {% endfor %}
</table>
